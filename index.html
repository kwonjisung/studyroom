<style>

  --g1:#4a2a30; --g1b:#8a4d57; --g2:#22374d; --g2b:#4f7aa3; --g3:#1f3e2d; --g3b:#4f9a6c;

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent;};
const jaH=t=>String(t||'').replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\^/g,'<wbr>').replace(/[⟦⟧]/g,'');
const jaP=t=>String(t||'').replace(/<[^>]+>/g,'').replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$1').replace(/[\^⟦⟧]/g,'');
const gtEN=t=>'https://translate.google.com/?sl=en&tl=ko&op=translate&text='+encodeURIComponent(t);
const gtJA=t=>'https://translate.google.com/?sl=ja&tl=ko&op=translate&text='+encodeURIComponent(t);
const WORKS={op:'원피스',fr:'장송의 프리렌',ky:'귀멸의 칼날',jj:'주술회전',hh:'헌터×헌터'};
const DOW='일월화수목금토';
const TODAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const dowOf=iso=>new Date(iso+'T00:00:00Z').getUTCDay();
const md=iso=>`${+iso.slice(5,7)}/${+iso.slice(8)}`;
const tag=iso=>iso.replace(/-/g,'');

const D={en:[],ja:[],enT:[],jaT:[],sched:null,gloss:{},roots:{}};

/* ── 단어 뜻 (마우스를 올리면 브라우저 기본 말풍선으로 표시) ── */
function glossOf(word, e){
  const g=D.gloss||{}; const w=word.toLowerCase().replace(/’/g,"'");
  const vocab={}; (e&&e.vocab||[]).forEach(v=>{ vocab[v.word.toLowerCase()]=v.meaning; });
  const cands=[w, w.replace(/'s$/,''), w.replace(/s$/,''), w.replace(/es$/,''), w.replace(/ies$/,'y'), w.replace(/ed$/,''), w.replace(/d$/,''), w.replace(/ing$/,''), w.replace(/ing$/,'e'), w.replace(/ly$/,'')];
  for(const c of cands){ if(vocab[c]) return vocab[c]; }      // 오늘의 핵심 단어 뜻이 먼저
  for(const c of cands){ if(c && g[c]) return g[c]; }
  return '';
}
/* ── 핵심 단어 어원 카드 (단어를 누르면 작은 카드) ── */
function rootKey(word){
  const r=D.roots||{}; const w=word.toLowerCase().trim();
  const c=[w,w.replace(/s$/,''),w.replace(/es$/,''),w.replace(/ies$/,'y'),w.replace(/ed$/,''),w.replace(/d$/,''),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/ly$/,'')];
  return c.find(x=>x&&r[x])||'';
}
function closeRoot(){ const c=document.getElementById('rootCard'); if(c) c.remove(); }
function showRoot(word, anchor, meaning){
  const k=rootKey(word); if(!k) return; const r=D.roots[k];
  if(document.getElementById('rootCard')?.dataset.k===k){ closeRoot(); return; }
  closeRoot();
  const c=document.createElement('div'); c.id='rootCard'; c.className='rootcard'; c.dataset.k=k; c.setAttribute('role','dialog');
  c.innerHTML=`<div class="rh"><b>${esc(k)}</b><span>${esc(meaning||'')}</span><button class="x" type="button" aria-label="닫기">✕</button></div>`
   +(r.s?`<div class="parts">${r.s.map(([p,m])=>`<span class="pc"><i>${esc(p)}</i><small>${esc(m)}</small></span>`).join('<span class="plus">+</span>')}</div>`:'')
   +`<p class="core">→ ${esc(r.c)}</p>`
   +(r.f?`<ul class="fam">${r.f.map(([w,m])=>`<li><b>${esc(w)}</b> · ${esc(m)}</li>`).join('')}</ul>`:'')
   +(r.t?`<div class="tip">💡 ${esc(r.t)}</div>`:'');
  document.body.append(c);
  const a=anchor.getBoundingClientRect(), W=c.offsetWidth, H=c.offsetHeight;
  let x=a.left+window.scrollX, y=a.bottom+window.scrollY+6;
  x=Math.max(window.scrollX+16, Math.min(x, window.scrollX+document.documentElement.clientWidth-W-16));
  if(a.bottom+H+12>window.innerHeight && a.top>H+12) y=a.top+window.scrollY-H-6;
  c.style.left=x+'px'; c.style.top=y+'px';
  c.querySelector('.x').onclick=closeRoot;
}
document.addEventListener('click',ev=>{ if(!ev.target.closest('#rootCard,.rk')) closeRoot(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') closeRoot(); });
window.addEventListener('resize',()=>{ closeRoot(); closeBub(); });

/* ── 문단별 듣기: 본문 MP3의 문단 구간만 재생 ── */
let seg=null;
function segOff(){ if(!seg) return; seg.btn.classList.remove('on'); if(seg.host) seg.host.classList.remove('playing'); seg=null; }
function setupSeg(e, audId, sheetId, noteId){
  const a=$(audId); if(!a||!e.mp3_marks) return;
  if(!a.dataset.seg){ a.dataset.seg='1';
    a.addEventListener('timeupdate',()=>{ if(seg&&seg.a===a&&a.currentTime>=seg.end){ a.pause(); segOff(); } });
    a.addEventListener('pause',()=>{ if(seg&&seg.a===a&&Date.now()-seg.t>400&&a.currentTime<seg.end-0.3) segOff(); });
    a.addEventListener('seeking',()=>{ if(seg&&seg.a===a&&(a.currentTime<seg.start-0.5||a.currentTime>seg.end)) segOff(); });
  }
  $(sheetId).querySelectorAll('.psay button').forEach(b=>b.onclick=async ev=>{
    ev.stopPropagation();
    if(seg&&seg.btn===b){ a.pause(); segOff(); return; }
    const [st,en]=e.mp3_marks[b.dataset.seg][+b.dataset.p];
    stopPlay(); segOff();
    seg={a,btn:b,start:st,end:en,t:Date.now(),host:b.parentElement.closest('[data-p]')}; b.classList.add('on'); seg.host.classList.add('playing');
    try{
      if(a.readyState<1){ a.preload='auto'; a.load(); await new Promise((ok,no)=>{ a.addEventListener('loadedmetadata',ok,{once:true}); a.addEventListener('error',no,{once:true}); }); }
      a.currentTime=st; await a.play();
    }catch(err){ segOff(); $(noteId).textContent='MP3를 재생하지 못했습니다. 잠시 뒤 다시 눌러 주세요.'; }
  });
}
const psay=(e,i,what)=>e.mp3_marks&&e.mp3_marks.slow[i]?`<span class="psay"><button type="button" data-seg="slow" data-p="${i}" aria-label="${what} ${i+1} 느리게 듣기">▶ 느리게</button><button type="button" data-seg="normal" data-p="${i}" aria-label="${what} ${i+1} 보통 속도로 듣기">▶ 보통</button></span>`:'';

/* 해석 표시용: <u>, <mark class="g1|g2|g3"> 만 허용 */
function safeMark(t){ return esc(t).replace(/&lt;(\/?)u&gt;/g,'<$1u>').replace(/&lt;mark class=&quot;(g[123])&quot;&gt;/g,'<mark class="$1">').replace(/&lt;\/mark&gt;/g,'</mark>'); }

/* ── 단어 뜻: 누르면(터치 포함) 작은 말풍선 ── */
function closeBub(){ const b=document.getElementById('gBub'); if(b) b.remove(); document.querySelectorAll('.gw.tapped').forEach(x=>x.classList.remove('tapped')); }
function showBub(el){
  const m=el.dataset.m||el.title; if(!m) return;
  if(el.classList.contains('tapped')){ closeBub(); return; }
  closeBub(); el.classList.add('tapped');
  const b=document.createElement('div'); b.id='gBub'; b.className='gbub'; b.setAttribute('role','status');
  b.innerHTML=`<b>${esc(el.textContent)}</b>${esc(m)}`; b.dataset.y=window.scrollY; document.body.append(b);
  const r=el.getBoundingClientRect(), W=b.offsetWidth, H=b.offsetHeight;
  let x=r.left+window.scrollX+r.width/2-W/2; x=Math.max(window.scrollX+12,Math.min(x,window.scrollX+document.documentElement.clientWidth-W-12));
  let y=r.top+window.scrollY-H-6; if(r.top<H+12) y=r.bottom+window.scrollY+6;
  b.style.left=x+'px'; b.style.top=y+'px';
}
document.addEventListener('click',ev=>{
  const g=ev.target.closest('.gw');
  if(g&&!g.closest('.rk')){ showBub(g); return; }
  if(!ev.target.closest('#gBub')) closeBub();
});
window.addEventListener('scroll',()=>{ const b=document.getElementById('gBub'); if(b&&Math.abs(window.scrollY-(+b.dataset.y||0))>40) closeBub(); },{passive:true});

/* ── MP3 따라 읽기 표시: 재생 중인 단어(영어)·문장(일본어)에 회색 블록, 멈추면 사라짐 ── */
function wrapTokens(sheet){
  sheet.querySelectorAll('.reading p[data-p]').forEach(p=>{
    const pi=p.dataset.p, walker=document.createTreeWalker(p,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.psay,button,a')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    let idx=-1, inTok=false;
    nodes.forEach(n=>{
      const t=n.nodeValue; if(!t) return;
      const frag=document.createDocumentFragment();
      t.split(/(\s+)/).forEach(part=>{
        if(!part) return;
        if(/^\s+$/.test(part)){ inTok=false; frag.append(part); return; }
        if(!inTok){ idx++; inTok=true; }
        const sp=document.createElement('span'); sp.className='tw'; sp.dataset.w=pi+'-'+idx; sp.textContent=part; frag.append(sp);
      });
      n.replaceWith(frag);
    });
    p.dataset.nw=idx+1;
  });
}
const twWeight=s=>Math.max(1.5,s.replace(/[^A-Za-z0-9]/g,'').length+1.5+(/[,;:]['”’"]?$/.test(s)?3:0));
function followSetup(e){
  const a=$('enAud'), sheet=$('enSheet'); if(!a||!e.mp3_marks) return;
  wrapTokens(sheet);
  // 단어 시작 시각: mp3_words 가 있으면 그것, 없으면 문단 구간 안에서 글자 수 비례
  const words={};
  ['slow','normal'].forEach(m=>{ words[m]=e.mp3_marks[m].map(([st,en],pi)=>{
    if(e.mp3_words&&e.mp3_words[m]&&e.mp3_words[m][pi]) return e.mp3_words[m][pi];
    const toks=[...sheet.querySelectorAll(`.reading p[data-p="${pi}"] .tw`)].reduce((acc,s)=>{ const [,i]=s.dataset.w.split('-'); acc[+i]=(acc[+i]||'')+s.textContent; return acc; },[]);
    const w=toks.map(twWeight), tot=w.reduce((x,y)=>x+y,0)||1; let acc=0;
    return w.map(x=>{ const t=st+0.12+(en-st-0.24)*acc/tot; acc+=x; return +t.toFixed(2); });
  }); });
  let cur='', raf=0;
  const clear=()=>{ sheet.querySelectorAll('.tw.cur').forEach(s=>s.classList.remove('cur')); sheet.querySelectorAll('.reading p.reading-now').forEach(p=>p.classList.remove('reading-now')); cur=''; };
  const tick=()=>{
    const t=a.currentTime; let key='';
    for(const m of ['slow','normal']){ const segs=e.mp3_marks[m];
      for(let pi=0;pi<segs.length;pi++){ const [st,en]=segs[pi]; if(t>=st&&t<=en){
        const ws=words[m][pi]; let i=0; while(i+1<ws.length&&ws[i+1]<=t) i++; key=pi+'-'+i; break; } }
      if(key) break; }
    if(key!==cur){ clear(); if(key){ cur=key; sheet.querySelectorAll(`.tw[data-w="${key}"]`).forEach(s=>s.classList.add('cur')); const p=sheet.querySelector(`.reading p[data-p="${key.split('-')[0]}"]`); if(p) p.classList.add('reading-now'); } }
    if(!a.paused) raf=requestAnimationFrame(tick);
  };
  a.addEventListener('play',()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); });
  a.addEventListener('pause',()=>{ cancelAnimationFrame(raf); clear(); });
  a.addEventListener('ended',()=>{ cancelAnimationFrame(raf); clear(); });
  a.addEventListener('seeked',()=>{ if(!a.paused){ cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); } });
}
function followSetupJA(e){
  const a=$('jaAud'), sheet=$('jaSheet'); if(!a||!e.mp3_marks) return;
  let raf=0, cur=-1;
  const clear=()=>{ sheet.querySelectorAll('.qs.speaking').forEach(x=>x.classList.remove('speaking')); cur=-1; };
  const tick=()=>{
    const t=a.currentTime; let k=-1;
    ['slow','normal'].forEach(m=>e.mp3_marks[m].forEach(([st,en],i)=>{ if(t>=st&&t<=en) k=i; }));
    if(k!==cur){ clear(); cur=k; if(k>=0){ const q=sheet.querySelector(`.qs[data-p="${k}"]`); if(q) q.classList.add('speaking'); } }
    if(!a.paused) raf=requestAnimationFrame(tick);
  };
  a.addEventListener('play',()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); });
  a.addEventListener('pause',()=>{ cancelAnimationFrame(raf); clear(); });
  a.addEventListener('ended',()=>{ cancelAnimationFrame(raf); clear(); });
}

function glossify(root, e){
  if(!root) return;
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>n.parentElement.closest('a,button,.say,.gw')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue; if(!/[A-Za-z]/.test(t)) return;
    const frag=document.createDocumentFragment(); let last=0;
    t.replace(/[A-Za-z]+(?:['’][A-Za-z]+)?/g,(m,i)=>{
      const k=glossOf(m,e); if(!k) return m;
      if(i>last) frag.append(t.slice(last,i));
      const sp=document.createElement('span'); sp.className='gw'; sp.title=k; sp.dataset.m=k; sp.textContent=m; frag.append(sp);
      last=i+m.length; return m;
    });
    if(last===0) return;
    if(last<t.length) frag.append(t.slice(last));
    n.replaceWith(frag);
  });
}

async function savePdf(path,filename,btn,note){
  const label=btn.textContent; btn.disabled=true; btn.textContent='PDF 준비 중…';
  try{
    if(!downloads){ // claude.ai 밖(GitHub Pages 등): 일반 다운로드 링크로 저장
      const a=document.createElement('a'); a.href=path; a.download=filename; document.body.append(a); a.click(); a.remove();

    const blob=await (await fetch(path)).blob();

/* 휴대폰: 화면을 좌우로 밀어 탭 이동 (홈 ↔ 영어 ↔ 일본어 ↔ 테스트) */
(()=>{
  let sx=0, sy=0, st=0, ok=false;
  const cur=()=>VIEWS.find(v=>!$('v-'+v).hidden)||'home';
  document.addEventListener('touchstart',ev=>{
    if(ev.touches.length!==1){ ok=false; return; }
    const t=ev.target; ok=!t.closest('audio,select,input,textarea,.rootcard,.gbub,[data-noswipe]');
    // 가로 스크롤 영역(달력 등) 안에서 시작하면 제외
    for(let n=t; n&&n!==document.body; n=n.parentElement){ if(n.scrollWidth>n.clientWidth+4&&/(auto|scroll)/.test(getComputedStyle(n).overflowX)){ ok=false; break; } }
    sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; st=Date.now();
  },{passive:true});
  document.addEventListener('touchend',ev=>{
    if(!ok) return; ok=false;
    const t=ev.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>700||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6) return;
    if(window.getSelection&&String(window.getSelection()).length) return;
    const i=VIEWS.indexOf(cur()), j=i+(dx<0?1:-1);
    if(j<0||j>=VIEWS.length) return;
    closeRoot(); closeBub(); show(VIEWS[j]);
    const v=$('v-'+VIEWS[j]); v.classList.remove('swl','swr'); void v.offsetWidth; v.classList.add(dx<0?'swl':'swr');
  },{passive:true});
})();

const tts=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
let playing=null;
function enVoice(){ try{ const vs=speechSynthesis.getVoices(); return vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){return null;} }
function stopPlay(){ try{ if(tts) speechSynthesis.cancel(); }catch(e){} if(playing){ playing.classList.remove('on'); if(playing.id==='allWords') playing.textContent='▶ 전체 3번씩'; } playing=null; ['enAud','jaAud'].forEach(id=>{ const a=$(id); if(a) a.pause(); }); }
function play(words,btn){
  if(playing===btn){ stopPlay(); return; }
  stopPlay();
  if(!tts){ window.open(gtEN(words.map(w=>[w,w,w].join('. ')).join('. ')+'.'),'_blank','noopener'); return; }
  playing=btn; btn.classList.add('on'); if(btn.id==='allWords') btn.textContent='■ 멈추기';
  const voice=enVoice(), q=[]; words.forEach(w=>{ for(let k=0;k<3;k++) q.push(w); });
  let n=0;
  const next=()=>{ if(playing!==btn) return; if(n>=q.length){ stopPlay(); return; }
    const u=new SpeechSynthesisUtterance(q[n]); u.lang='en-US'; if(voice) u.voice=voice; u.rate=0.85;
    const gap=(n%3===2)?900:450; n++; u.onend=()=>setTimeout(next,gap); u.onerror=()=>stopPlay(); speechSynthesis.speak(u); };
  next();
}
if(tts){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){} }

const normEN=t=>String(t||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const kata2hira=t=>String(t||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const normJA=t=>kata2hira(String(t||'').normalize('NFKC')).replace(/[\s。、．，.!！?？「」]/g,'');

const qText=(lang,t)=>{ let h=esc(t).replace(/&lt;(\/?)(b|br)&gt;/g,'<$1$2>').replace(/&lt;span class=['"]?sub['"]?&gt;/g,'<span class="sub">').replace(/&lt;\/span&gt;/g,'</span>'); if(lang==='ja') h=jaH(h); return h.replace(/___/g,'<span class="qblank">　　　</span>'); };
const qPlain=(lang,t)=>lang==='ja'?jaH(esc(t)):esc(t);
let QZ=null;   // {lang,date,data,ans:{},self:{},done:false}
async function openQuiz(lang,date){

function closeQuiz(){ QZ=null; $('quizBox').hidden=true; $('quizBox').innerHTML=''; $('testList').closest('.panel').hidden=false; renderTests(); renderHome(); window.scrollTo({top:0}); }
function gradeItem(it,a){
  if(it.kind==='choice') return a!==undefined&&a!==''&&+a===it.answer;
  if(it.kind==='ox') return a===it.answer;
  if(it.kind==='text'){ const n=QZ.lang==='ja'?normJA:normEN; const ok=[it.answer,...(it.accept||[])].map(n); return a!==undefined&&ok.includes(n(a)); }
  return null;
}
function quizScore(){
  let sc=0, need=0;
  QZ.data.sections.forEach((s,si)=>s.items.forEach((it,ii)=>{ const k=si+'-'+ii;
    if(it.kind==='self'){ if(QZ.self[k]===true) sc+=s.each; if(QZ.self[k]===undefined) need++; }
    else if(gradeItem(it,QZ.ans[k])) sc+=s.each; }));
  return {sc,need};
}
function drawQuiz(){
  const {lang:L,data}=QZ, done=QZ.done, pass=data.pass||80;
  const total=data.sections.reduce((a,s)=>a+s.items.length,0);
  const answered=Object.keys(QZ.ans).filter(k=>String(QZ.ans[k]).trim()!=='').length;
  const {sc,need}=done?quizScore():{sc:0,need:0};
  const prev=QR[L+'|'+QZ.date];
  const jf=L==='ja'?' class="jaf" lang="ja"':'';
  let h=`<div class="qhead"><div><span class="k">${L==='en'?'ENGLISH':'日本語'} · ${esc(data.no)}</span><h2>${esc(data.title)}</h2>
      <span class="m">${done?(need?`'스스로 채점' 문항 ${need}개를 표시하면 점수가 확정돼요`:`채점 끝 · ${pass}점 이상 통과`):`${answered} / ${total} 문항 답함 · 다 풀고 맨 아래 '채점하기'`}${prev&&!done?` · 지난 기록 ${prev.score}점`:''}</span></div>
      <button class="btn" type="button" id="qClose">✕ 닫기</button></div>`;
  if(done) h+=`<div class="qscore ${!need&&sc>=pass?'pass':''}"><b>${sc}</b><span>/ 100</span><em>${need?'스스로 채점 전':sc>=pass?'통과! 🎉':'틀린 문항의 학습지를 다시 보세요'}</em></div>`;
  data.sections.forEach((s,si)=>{
    h+=`<section class="qsec"><div class="sec"><span>${esc(s.id)}. ${esc(s.title)}</span><span class="m">${s.items.length}문항 × ${s.each}점</span></div><p class="m">${esc(s.guide||'')}</p><ol>`;
    s.items.forEach((it,ii)=>{
      const k=si+'-'+ii, a=QZ.ans[k], g=done?gradeItem(it,a):null;
      const mark=done&&it.kind!=='self'?(g?'<span class="qok">✓</span>':'<span class="qng">✗</span>'):'';
      h+=`<li class="qitem ${done&&it.kind!=='self'?(g?'ok':'ng'):''}"><div class="qq${L==='ja'?' jaf':''}"${L==='ja'?' lang="ja"':''}>${mark}${qText(L,it.q)}${it.from?` <small class="m">${esc(it.from)}</small>`:''}</div>${it.hint?`<div class="m qh">${esc(it.hint)}</div>`:''}`;
      if(it.kind==='choice'){
        h+=`<div class="qch"${L==='ja'?' lang="ja"':''}>${it.choices.map((c,ci)=>`<button type="button" class="qc ${a!==undefined&&a!==''&&+a===ci?'sel':''} ${done&&ci===it.answer?'right':''}" data-k="${k}" data-v="${ci}" ${done?'disabled':''}>${qPlain(L,c)}</button>`).join('')}</div>`;
      }else if(it.kind==='ox'){
        h+=`<div class="qch">${['O','X'].map(v=>`<button type="button" class="qc ox ${a===v?'sel':''} ${done&&v===it.answer?'right':''}" data-k="${k}" data-v="${v}" ${done?'disabled':''}>${v}</button>`).join('')}</div>`;
      }else{
        h+=`<input class="qin" data-k="${k}" value="${esc(a||'')}" ${done?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"${L==='ja'?' lang="ja"':''} placeholder="${it.kind==='self'?'여기에 써 보세요':'답 입력'}" aria-label="${si+1}-${ii+1} 답">`;
      }
      if(done){
        if(it.kind==='self') h+=`<div class="qans">모범 답: <b${jf}>${qPlain(L,it.answer)}</b></div><div class="qch">
          <button type="button" class="qc ${QZ.self[k]===true?'sel right':''}" data-self="${k}" data-v="1">맞았어요</button><button type="button" class="qc ${QZ.self[k]===false?'sel':''}" data-self="${k}" data-v="0">틀렸어요</button></div>`;
        else if(!g||it.explain) h+=`<div class="qans">${!g?`정답: <b${jf}>${qPlain(L,it.kind==='choice'?it.choices[it.answer]:it.answer)}</b> `:''}${it.explain?`<span class="m">${esc(it.explain)}</span>`:''}</div>`;
      }
      h+='</li>';
    });
    h+='</ol></section>';
  });
  h+=`<div class="bar qend">${done?`<button class="btn test" type="button" id="qRetry">처음부터 다시 풀기</button><button class="btn" type="button" id="qClose2">목록으로</button>`:`<button class="btn test" type="button" id="qGrade">채점하기</button><span class="m" id="qCount">${answered} / ${total} 문항 답함</span>`}</div><div class="note" id="qNote"></div>`;
  const box=$('quizBox'); box.innerHTML=h; box.style.setProperty('--c',`var(--${L})`);
  $('qClose').onclick=closeQuiz; if($('qClose2')) $('qClose2').onclick=closeQuiz;
  const keep=fn=>{ const y=window.scrollY; fn(); window.scrollTo(0,y); };
  const save=()=>lsSet(`sr-qd-${QZ.lang}-${QZ.date}`,QZ.ans);
  box.querySelectorAll('.qc[data-k]').forEach(b=>b.onclick=()=>{ QZ.ans[b.dataset.k]=b.dataset.v; save(); keep(drawQuiz); });
  box.querySelectorAll('.qin').forEach(i=>i.oninput=()=>{ QZ.ans[i.dataset.k]=i.value; save();
    const c=$('qCount'); if(c) c.textContent=`${Object.keys(QZ.ans).filter(k=>String(QZ.ans[k]).trim()!=='').length} / ${total} 문항 답함`; });
  box.querySelectorAll('[data-self]').forEach(b=>b.onclick=async()=>{ QZ.self[b.dataset.self]=b.dataset.v==='1'; await finish(); keep(drawQuiz); });
  if($('qGrade')) $('qGrade').onclick=async()=>{
    const left=total-Object.keys(QZ.ans).filter(k=>String(QZ.ans[k]).trim()!=='').length;
    if(left&&$('qGrade').dataset.warned!=='1'){ $('qGrade').dataset.warned='1'; $('qGrade').textContent='그래도 채점하기'; $('qNote').textContent=`아직 ${left}문항이 비어 있어요. 한 번 더 누르면 빈 문항은 틀린 것으로 채점해요.`; return; }
    QZ.done=true; await finish(); drawQuiz(); window.scrollTo({top:0});
  };
  if($('qRetry')) $('qRetry').onclick=()=>{ QZ.ans={}; QZ.self={}; QZ.done=false; save(); drawQuiz(); window.scrollTo({top:0}); };
}
async function finish(){
  const {sc,need}=quizScore();
  await saveResult(QZ.lang,QZ.date,{score:sc,total:100,pass:QZ.data.pass||80,at:new Date().toISOString(),pending:need,no:QZ.data.no});
}

  ].sort((a,b)=>b.date.localeCompare(a.date)||a.lang.localeCompare(b.lang));

    $('testList').innerHTML=`<div class="empty">아직 복습 테스트가 없습니다.<br>다음 테스트는 ${md(nextT)}(${DOW[dowOf(nextT)]}) 아침, 영어·일본어 각각 도착합니다. 목요일은 월~수, 일요일은 목~토 학습지가 범위예요.</div>`; return;
  }
  const pagesOf=(lang,date)=>((D.timg||{})[lang]||{})[date]||0;
  const viewer=(lang,t)=>{ const n=pagesOf(lang,t.date); const qz=hasQuiz(lang,t.date);
    if(!n&&!qz) return '';
    return `<div class="qrow">${qStatus(lang,t.date)}</div><div class="bar tview">${qz?`<button class="btn test" type="button" data-quiz="${lang}|${t.date}">✏️ ${QR[lang+'|'+t.date]?'다시 풀기':'앱에서 풀기'}</button>`:''}${n?`<button class="btn ${lang}" type="button" data-show="q">📄 문제 보기</button>${n>2?`<button class="btn" type="button" data-show="a">✓ 정답·해설 보기</button>`:''}`:''}</div>
      <div class="tpages" hidden data-lang="${lang}" data-date="${t.date}" data-n="${n}"></div>`; };
  $('testList').innerHTML=items.map((x,i)=>{
    const t=x.t;
    if(x.lang==='en'){
      const cov=(t.covers||[]).map(no=>D.en.find(e=>e.no===no)).filter(Boolean);
      return `<div class="titem" style="--c:var(--en)"><span class="k">ENGLISH · ${esc(t.no)}</span><span class="t">영어 복습 테스트 · ${md(t.date)}(${DOW[dowOf(t.date)]})</span>
      <span class="m">범위 ${md(t.range_start)} ~ ${md(t.range_end)}${t.covers?` · 학습지 ${t.covers.length}장`:''} · 단어·빈칸·문법·O/X·영작 100점</span>
      ${cov.length?`<details class="tcov"><summary>시험 범위 학습지 ${cov.length}장</summary><ul>${cov.map(e=>`<li><b>${md(e.date)}</b> <span class="enf">${esc(e.title)}</span><span class="m"> · ${e.grammar.map(g=>esc(g.name)).join(' / ')}</span></li>`).join('')}</ul></details>`:''}
      ${viewer('en',t)}
      <div class="bar">${t.pdf?`<button class="btn" type="button" data-pdf="en/${esc(t.pdf)}" data-fn="EnglishTest_${t.date}.pdf">PDF 저장</button>`:''}</div><div class="note"></div></div>`;
    }
    return `<div class="titem" style="--c:var(--ja)"><span class="k">日本語 · ${esc(t.no)}</span><span class="t">${esc(t.title||'일본어 복습 테스트')} · ${md(t.date)}(${DOW[dowOf(t.date)]})</span>
      <span class="m">${esc(t.range_display||'')}</span>
      ${(t.sections||[]).length?`<div class="tsec">${t.sections.map(s=>`<span>${esc(s.id)}. ${esc(s.title)} · ${esc(s.count)}문항</span>`).join('')}</div>`:''}
      ${(t.review||[]).length?`<details class="tcov"><summary>시험 범위 대사 ${t.review.length}개</summary><ul>${t.review.map(r=>`<li><b>${esc(r.date)}</b> <span class="jaf" lang="ja">${jaH(r.quote)}</span><span class="m"> · ${esc(r.work)} ${esc(r.speaker)}</span></li>`).join('')}</ul></details>`:''}
      ${viewer('ja',t)}
      <div class="bar">${t.pdf?`<button class="btn" type="button" data-pdf="ja/${esc(t.pdf)}" data-fn="${esc(t.file||'JapaneseTest_'+t.date+'.pdf')}">PDF 저장</button>`:''}</div><div class="note"></div></div>`;
  }).join('');
  $('testList').querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{ const [l,d]=b.dataset.quiz.split('|'); openQuiz(l,d); });
  $('testList').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{
    const it=b.closest('.titem'), box=it.querySelector('.tpages'), mode=b.dataset.show, n=+box.dataset.n;
    const on=!box.hidden&&box.dataset.mode===mode;
    it.querySelectorAll('[data-show]').forEach(x=>x.classList.remove('on'));
    if(on){ box.hidden=true; box.dataset.mode=''; return; }
    const pg=mode==='a'?[n]:Array.from({length:n>2?n-1:n},(_,k)=>k+1);
    box.innerHTML=pg.map(k=>`<a href="${box.dataset.lang}/testimg/${box.dataset.date}-${k}.jpg" target="_blank" rel="noopener"><img loading="lazy" src="${box.dataset.lang}/testimg/${box.dataset.date}-${k}.jpg" alt="${mode==='a'?'정답·해설':'문제'} ${k}쪽"></a>`).join('');
    box.dataset.mode=mode; box.hidden=false; b.classList.add('on');
  });
  $('testList').querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>savePdf(b.dataset.pdf,b.dataset.fn,b,b.closest('.titem').querySelector('.note')));
}

  D.gloss=gloss||{}; D.roots=roots||{}; D.timg=timg||{}; D.quiz=quiz||{};

  loadLocalResults();
  renderHome(); renderCal(TODAY); renderEN(); renderJA(); renderJAPlan(); renderTests();
  loadCloudResults();
  const h=(location.hash||'').slice(1);
